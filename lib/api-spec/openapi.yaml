openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Presenter Notes API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: notes
    description: Presentation notes operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes
      description: Legacy full-content array, limited to 10 notes per page. Prefer /notes/page for metadata-only pagination.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring search across title, event, and content; combines with the event filter
        - name: event
          in: query
          required: false
          schema:
            type: string
          description: Filter by event name (partial match)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "401":
          description: Unauthorized

    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note
      description: Create a new presentation note (from markdown upload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /notes/page:
    get:
      operationId: listNoteSummaries
      tags: [notes]
      summary: List a bounded page of note metadata and previews
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 256
        - name: event
          in: query
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Metadata only; use GET /notes/{id} for full content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotePage"
        "400":
          description: Invalid pagination or filter
        "401":
          description: Unauthorized
        "429":
          description: Per-user request budget exceeded; respect Retry-After

  /notes/events:
    get:
      operationId: listEvents
      tags: [notes]
      summary: List distinct events
      description: Get a list of all distinct event names for filtering/navigation
      responses:
        "200":
          description: List of distinct events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          description: Unauthorized

  /notes/stats:
    get:
      operationId: getNotesStats
      tags: [notes]
      summary: Get notes statistics
      description: Returns summary stats for the dashboard
      responses:
        "200":
          description: Notes statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesStats"
        "401":
          description: Unauthorized

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note
      description: Get a single presentation note by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      description: Update a presentation note's metadata or content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteBody"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Not found

    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      description: Delete a presentation note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /notes/upload:
    post:
      operationId: uploadNoteMarkdown
      tags: [notes]
      summary: Upload markdown file
      description: Create a new note from markdown. Parses frontmatter for title, event, date, and tags; filenames are not deduplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadMarkdownBody"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /notes/agent-upload:
    post:
      operationId: agentUploadNote
      tags: [notes]
      summary: Agent upload endpoint
      description: Create a note using Authorization Bearer or X-API-Key header authentication. A legacy body apiKey is also accepted. Query-string authentication is not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUploadBody"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Note:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
          description: Clerk user id of the note owner (server-assigned)
        title:
          type: string
        event:
          type: string
        eventDate:
          type: ["string", "null"]
          description: ISO date string of when the presentation was given
        content:
          type: string
          description: Raw markdown content
        tags:
          type: array
          items:
            type: string
        filename:
          type: ["string", "null"]
          description: Original uploaded filename
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - title
        - event
        - eventDate
        - content
        - tags
        - filename
        - createdAt
        - updatedAt

    NoteSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        event:
          type: string
        eventDate:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        filename:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        preview:
          type: string
          maxLength: 240
      required: [id, title, event, eventDate, tags, filename, createdAt, updatedAt, preview]

    NotePage:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSummary"
        hasMore:
          type: boolean
      required: [notes, hasMore]

    NoteList:
      type: array
      items:
        $ref: "#/components/schemas/Note"

    CreateNoteBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        event:
          type: string
          minLength: 1
          maxLength: 256
        eventDate:
          type: ["string", "null"]
          format: date
        content:
          type: string
          description: At most 256 KiB in UTF-8; larger content returns 413. Title and event must not be blank.
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
        filename:
          type: ["string", "null"]
          minLength: 1
          maxLength: 255
      required:
        - title
        - event
        - content

    UpdateNoteBody:
      type: object
      description: At least one recognized field is required. Only submitted fields are validated, so legacy records can be repaired incrementally.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        event:
          type: string
          minLength: 1
          maxLength: 256
        eventDate:
          type: ["string", "null"]
          format: date
        content:
          type: string
          description: At most 256 KiB in UTF-8; larger content returns 413.
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64

    UploadMarkdownBody:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          description: Raw markdown, at most 256 KiB UTF-8 including frontmatter. Effective frontmatter fields follow the same validation as note creation.
      required:
        - filename
        - content

    AgentUploadBody:
      type: object
      properties:
        apiKey:
          type: string
          description: Legacy authentication fallback. Prefer Authorization Bearer or X-API-Key headers; an explicit header takes precedence.
          deprecated: true
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          description: Raw markdown, at most 256 KiB UTF-8 including frontmatter
        title:
          type: ["string", "null"]
          minLength: 1
          maxLength: 256
        event:
          type: ["string", "null"]
          minLength: 1
          maxLength: 256
        eventDate:
          type: ["string", "null"]
          format: date
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
      required:
        - filename
        - content

    EventList:
      type: object
      properties:
        events:
          type: array
          items:
            type: string
      required:
        - events

    NotesStats:
      type: object
      properties:
        totalNotes:
          type: integer
        totalEvents:
          type: integer
        recentNotes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        topEvents:
          type: array
          items:
            type: object
            properties:
              event:
                type: string
              count:
                type: integer
            required:
              - event
              - count
      required:
        - totalNotes
        - totalEvents
        - recentNotes
        - topEvents
